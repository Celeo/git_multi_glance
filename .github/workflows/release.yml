name: Release

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: git_multi_glance-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: git_multi_glance-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: git_multi_glance-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: git_multi_glance-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/git_multi_glance ${{ matrix.asset_name }}

      - name: Prepare binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/git_multi_glance.exe ${{ matrix.asset_name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
